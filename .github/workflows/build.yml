name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller --onefile --console --clean --name PortWebProxy --add-data "web/static:static" app.py
      - name: Package
        run: |
          cd dist && tar -czf ../PortWebProxy-linux-x86_64.tar.gz PortWebProxy && cd ..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortWebProxy-linux-x86_64
          path: PortWebProxy-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller --onefile --console --clean --name PortWebProxy --add-data "web/static:static" app.py
      - name: Package
        run: |
          cd dist && zip -r ../PortWebProxy-macos-universal.zip PortWebProxy && cd ..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortWebProxy-macos
          path: PortWebProxy-macos-universal.zip
